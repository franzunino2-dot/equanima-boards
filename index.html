<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Equanima Boards</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/card.css">
<script src="config.js"></script>
</head>
<body>

<!-- ===================== Pantalla de carga ===================== -->
<div id="boot" class="boot">
  <div class="boot-logo">EB</div>
  <div class="boot-bar"><i></i></div>
</div>

<!-- ===================== Login ===================== -->
<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-logo">EB</div>
    <h1>Equanima Boards</h1>
    <p class="auth-sub">Tableros internos del equipo</p>

    <button id="btn-google" class="btn btn-google">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M23 12.2c0-.8-.1-1.6-.2-2.3H12v4.4h6.2c-.3 1.4-1.1 2.6-2.2 3.4v2.8h3.6C21.7 18.6 23 15.7 23 12.2z"/>
        <path fill="#34A853" d="M12 24c3 0 5.5-1 7.3-2.7l-3.6-2.8c-1 .7-2.3 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.5H2.1v3C3.9 21.4 7.7 24 12 24z"/>
        <path fill="#FBBC05" d="M5.8 15.1c-.2-.7-.4-1.4-.4-2.1s.1-1.5.4-2.1v-3H2.1C1.4 9.3 1 10.6 1 12s.4 2.7 1.1 4.1l3.7-1z"/>
        <path fill="#EA4335" d="M12 4.8c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 1.5 15 .5 12 .5 7.7.5 3.9 3 2.1 6.9l3.7 3C6.7 7.2 9.1 4.8 12 4.8z"/>
      </svg>
      <span>Entrar con Google</span>
    </button>

    <button id="btn-demo" class="btn btn-ghost btn-block">Probar en modo demo</button>

    <p class="auth-note">
      Acceso exclusivo para cuentas
      <b id="auth-domain">@equanimasecurities.com</b>
    </p>
    <p id="auth-error" class="auth-error" hidden></p>
  </div>
  <footer class="auth-foot">Equanima Securities · Mesa de Dinero</footer>
</section>

<!-- ===================== App ===================== -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="tb-icon" id="tb-home" title="Tableros (b)" aria-label="Tableros">
      <svg viewBox="0 0 24 24"><path d="M4 5h6v14H4zM14 5h6v9h-6z"/></svg>
    </button>
    <a class="tb-brand" href="#/">
      <span class="tb-logo">EB</span>
      <span class="tb-name">Equanima Boards</span>
    </a>

    <nav class="tb-nav">
      <button class="tb-btn" data-menu="boards">Tableros</button>
      <button class="tb-btn" data-menu="recent">Recientes</button>
      <button class="tb-btn" data-menu="starred">Destacados</button>
      <button class="tb-btn" id="tb-new">Crear</button>
    </nav>

    <div class="tb-search">
      <svg viewBox="0 0 24 24"><path d="M10 4a6 6 0 104.47 10.03l4.25 4.25 1.41-1.41-4.25-4.25A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z"/></svg>
      <input id="tb-q" type="search" placeholder="Buscar tarjetas…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>

    <div class="tb-right">
      <button class="tb-icon" id="tb-mine" title="Mis tarjetas (q)" aria-label="Mis tarjetas">
        <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 20 8l-1.4-1.4z"/></svg>
      </button>
      <button class="tb-icon" id="tb-bell" title="Novedades" aria-label="Novedades">
        <svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 002.5-2.5h-5A2.5 2.5 0 0012 22zm7-6v-5a7 7 0 10-14 0v5l-2 2v1h18v-1z"/></svg>
        <span class="badge" id="bell-badge" hidden></span>
      </button>
      <button class="tb-icon" id="tb-theme" title="Tema claro / oscuro" aria-label="Tema">
        <svg viewBox="0 0 24 24"><path d="M12 18a6 6 0 100-12 6 6 0 000 12zm0 4v-2m0-16V2m8 10h2M2 12h2m13.6 5.6l1.4 1.4M5 5l1.4 1.4m11.2 0L19 5M5 19l1.4-1.4"/></svg>
      </button>
      <button class="tb-avatar" id="tb-me" aria-label="Mi cuenta"></button>
    </div>
  </header>

  <main id="view" class="view"></main>
</div>

<!-- ===================== Capas ===================== -->
<div id="popover-layer"></div>
<div id="modal-layer"></div>
<div id="toast-layer" class="toast-layer"></div>
<div id="drag-layer" class="drag-layer"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
